services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes:
    build: .
    restart: unless-stopped
    # Must stay comfortably above apps/hermes/src/boot.ts's
    # HARD_EXIT_TIMEOUT_MS (8s, which itself sits above DRAIN_TIMEOUT_MS's
    # 5s) — Docker sends SIGTERM, waits this long, then SIGKILLs. Docker's
    # own default grace period here is far shorter than that budget, so
    # without this the container gets killed mid-shutdown before the app's
    # own hard-exit fallback ever gets a chance to run. Never lower one of
    # these three without raising the others to match.
    stop_grace_period: 15s
    depends_on:
      # `depends_on: condition: service_healthy` only gates container *start*
      # order — it does not guarantee Postgres accepts connections the
      # instant this container starts, so createPool/health still needs its
      # own retry-on-connect (see packages/store waitForDatabase).
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hermes:hermes@postgres:5432/hermes
      PORT: "3000"
      LOG_LEVEL: info
      # Required; not defaulted here — set in a local, gitignored .env (see
      # plans/00-skeleton.md Prerequisites). TELEGRAM_ALLOWLIST may be empty.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWLIST: ${TELEGRAM_ALLOWLIST:-}
      # LLM primary provider profile, required; LLM_FALLBACK_* are optional
      # but must be set all-or-none (see packages/config/src/schema.ts).
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # Monthly spend ceiling in USD, enforced before every provider call.
      # The `:-` passthrough turns an unset host var into "", which the
      # config schema coerces to 0 and rejects as non-positive — so a
      # deployment that forgets this fails boot naming the key rather than
      # running with no ceiling.
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-}
      # Google OAuth: all-or-none group, cleanly absent when unset (see
      # packages/config/src/schema.ts). TOKEN_ENCRYPTION_KEY generated with
      # the command in .env.example's Prerequisites cross-reference.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      # Has its own app-level default (see packages/config/src/schema.ts) —
      # unlike the `:-` passthrough above, this bakes the same default in
      # literally (matching PORT/LOG_LEVEL's pattern above) rather than
      # passing through "", which would fail the schema's z.string().url()
      # check instead of falling through to the default.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    # Telegram allows exactly one getUpdates consumer per bot token, so this
    # service is deliberately single-instance (see plans/00-skeleton.md).
    deploy:
      replicas: 1

volumes:
  postgres-data:
