services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes:
    build: .
    restart: unless-stopped
    depends_on:
      # `depends_on: condition: service_healthy` only gates container *start*
      # order — it does not guarantee Postgres accepts connections the
      # instant this container starts, so createPool/health still needs its
      # own retry-on-connect (see packages/store waitForDatabase).
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hermes:hermes@postgres:5432/hermes
      PORT: "3000"
      LOG_LEVEL: info
      # Required; not defaulted here — set in a local, gitignored .env (see
      # plans/00-skeleton.md Prerequisites). TELEGRAM_ALLOWLIST may be empty.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWLIST: ${TELEGRAM_ALLOWLIST:-}
    ports:
      - "3000:3000"
    # Telegram allows exactly one getUpdates consumer per bot token, so this
    # service is deliberately single-instance (see plans/00-skeleton.md).
    deploy:
      replicas: 1

volumes:
  postgres-data:
